name: EGRET ERP - Telegram Daily Trigger

on:
  schedule:
    # 每天台灣時間早上 10:00 自動執行 (UTC 02:00)
    - cron: '0 2 * * *'
  
  workflow_dispatch:

jobs:
  trigger_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Call Firebase to Send Saved Message
        run: |
          curl -s -X POST "https://asia-east1-egret-project-hub.cloudfunctions.net/checkTelegramSchedule" \
            -H "Content-Type: application/json"
