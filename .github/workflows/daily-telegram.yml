name: EGRET Daily Telegram Report

on:
  schedule:
    # UTC 00:30 = 台灣 08:30
    - cron: '30 0 * * *'

  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Message
        run: |
          MESSAGE="📊 EGRET Daily Report

✅ GitHub Actions 正常
✅ Telegram Bot 正常
✅ 自動排程正常

$(date)"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="$MESSAGE"
