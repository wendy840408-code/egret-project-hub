name: EGRET Daily Telegram Report

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Send EGRET Daily Report
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(TZ='Asia/Taipei' date '+%m/%d %A')
          TEXT="📊 EGRET Daily Report｜${TODAY}%0A%0A🔔 每日追蹤提醒%0A%0A👉 https://wendy840408-code.github.io/egret-project-hub/%0A%0A📌 今日請確認：%0A• 昨日聯絡紀錄%0A• 今日預計追蹤客戶%0A• 報價／樣品進度%0A%0A— EGRET Project Hub"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}"
