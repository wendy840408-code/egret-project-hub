name: EGRET Daily Telegram Report
 
on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
 
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send EGRET Daily Report
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=EGRET Daily Report - $(TZ='Asia/Taipei' date '+%m/%d') - Please check your projects today."
 
